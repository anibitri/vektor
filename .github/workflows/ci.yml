name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Ubuntu 26.04 runners ship GCC 14 and Clang 21 (the same major version as local development).
jobs:
  format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: find src tests -name '*.cpp' -o -name '*.hpp' | xargs clang-format-21 --dry-run --Werror

  test:
    name: Release build and tests (${{ matrix.cxx }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++-14, clang++-21]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  sanitizers:
    name: Debug build and tests under ASan + UBSan
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DVEKTOR_SANITIZE=address -DCMAKE_CXX_COMPILER=clang++-21
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  tsan:
    name: Debug build and tests under ThreadSanitizer
    runs-on: ubuntu-26.04
    env:
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug -DVEKTOR_SANITIZE=thread -DCMAKE_CXX_COMPILER=clang++-21
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure

  docker:
    name: Docker image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t vektor-server .
      - name: Check the image is at most 100 MB unpacked and the server starts
        run: |
          # `docker image inspect` may report the compressed size; the exported
          # file system of a container is the real unpacked size.
          docker create --name size-check vektor-server > /dev/null
          size=$(docker export size-check | wc -c)
          docker rm size-check > /dev/null
          echo "unpacked image size: $size bytes"
          test "$size" -le 100000000
          docker run -d --name vektor -p 8080:8080 vektor-server
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          curl -sf localhost:8080/health
          docker stop vektor

  ui:
    name: UI audit, lint, tests and build
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # Exactly the locked versions, with install scripts off (ui/.npmrc).
      - run: npm ci --no-fund
      # Fails if any package has a known vulnerability, or a registry signature does not match.
      - run: npm audit
      - run: npm audit signatures
      - run: npm run lint
      - run: npm test
      - run: npm run build

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cmake -B build -DCMAKE_CXX_COMPILER=clang++-21
      - run: find src tests -name '*.cpp' | xargs clang-tidy-21 -p build --quiet
